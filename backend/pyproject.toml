[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-q"
# STATIC_ROOT is only populated by collectstatic in the Docker build.
filterwarnings = ["ignore:No directory at:UserWarning"]
markers = ["real_client_factories: exercises the real API client factories (no fakes installed)"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]

[tool.coverage.run]
source = ["planner"]
